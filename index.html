<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff0f2">
  <title>Navigation Tabs Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="showcase">
    <header class="page-header">
      <h1>Navigation Tabs</h1>
      <p>Animation</p>
    </header>

    <section class="demo-section">
      <h2>RED NAVIGATION</h2>
      <nav class="nav-bar red-nav" aria-label="Red navigation">
        <span class="active-pill" aria-hidden="true"></span>
        <button class="nav-item" type="button" data-index="0" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Home</span>
        </button>
        <button class="nav-item" type="button" data-index="1">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="7.2"/><path d="m16.2 16.2 4.3 4.3"/></svg><span>Search</span>
        </button>
        <button class="nav-item" type="button" data-index="2">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg><span>Create</span>
        </button>
        <button class="nav-item has-dot" type="button" data-index="3">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 8.7 3.9a8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></svg><span>Inbox</span>
        </button>
        <button class="nav-item" type="button" data-index="4">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg><span>Saved</span>
        </button>
      </nav>
    </section>

    <section class="demo-section">
      <h2>DARK WAVE NAVIGATION</h2>
      <nav class="nav-bar dark-nav" aria-label="Dark wave navigation">
        <span class="wave-indicator" aria-hidden="true"></span>
        <span class="wave-dot" aria-hidden="true"></span>
        <button class="nav-item" type="button" data-index="0" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Home</span>
        </button>
        <button class="nav-item" type="button" data-index="1">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="7.2"/><path d="m16.2 16.2 4.3 4.3"/></svg><span>Search</span>
        </button>
        <button class="nav-item" type="button" data-index="2">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg><span>Create</span>
        </button>
        <button class="nav-item has-dot" type="button" data-index="3">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 8.7 3.9a8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></svg><span>Inbox</span>
        </button>
        <button class="nav-item" type="button" data-index="4">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg><span>Saved</span>
        </button>
      </nav>
    </section>

    <section class="demo-section">
      <h2>WHITE MINIMAL NAVIGATION</h2>
      <nav class="nav-bar white-nav" aria-label="White minimal navigation">
        <span class="white-pill" aria-hidden="true"></span>
        <button class="nav-item" type="button" data-index="0" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Home</span>
        </button>
        <button class="nav-item" type="button" data-index="1">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="7.2"/><path d="m16.2 16.2 4.3 4.3"/></svg><span>Search</span>
        </button>
        <button class="nav-item" type="button" data-index="2">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg><span>Create</span>
        </button>
        <button class="nav-item has-dot" type="button" data-index="3">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 8.7 3.9a8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></svg><span>Inbox</span>
        </button>
        <button class="nav-item" type="button" data-index="4">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg><span>Saved</span>
        </button>
      </nav>
    </section>
    <p class="hint">Tap any item to preview its active animation.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
